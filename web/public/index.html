<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚕️Galeno</title>
    <meta name="description"
        content="Galeno — simulador de consultas médicas para treino de anamnese. Pratique suas habilidades conversando com um paciente virtual.">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="layout">
        <!-- ============ SIDEBAR ============ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar__header">
                <div class="sidebar__logo">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2V22M2 12H22" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                    </svg>
                </div>
                <span class="sidebar__brand">Galeno User</span>
            </div>

            <div class="sidebar__actions">
                <button class="sidebar__new-chat" id="new-chat-btn" aria-label="Nova consulta">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <path d="M12 5v14M5 12h14" />
                    </svg>
                    Nova consulta
                </button>
            </div>

            <div class="sidebar__section-label">Consultas salvas</div>

            <div class="sidebar__chats" id="sidebar-chats">
                <div class="sidebar__empty" id="sidebar-empty">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.5">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
                    </svg>
                    <span>Nenhuma consulta salva</span>
                </div>
            </div>

            <div class="sidebar__footer">
                <button class="sidebar__save-btn" id="save-chat-btn" aria-label="Salvar consulta atual">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    Salvar consulta
                </button>
            </div>
        </aside>

        <!-- ============ CHAT APP ============ -->
        <div class="chat-app">
            <header class="chat-app__header">
                <div class="chat-app__header-content">
                    <!-- Toggle sidebar (mobile) -->
                    <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Abrir menu">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6" />
                            <line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <div class="chat-app__header-info">
                        <h1 class="chat-app__header-title">Galeno</h1>
                        <p class="chat-app__header-status">Online</p>
                    </div>
                </div>
            </header>

            <main class="chat-app__container" id="chat-container">
                <div class="chat-app__welcome" id="welcome-msg">
                    <div class="chat-app__welcome-icon">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2V22M2 12H22" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
                        </svg>
                    </div>
                    <h2 class="chat-app__welcome-title">Bem vindo ao Galeno</h2>
                    <p class="chat-app__welcome-text">Seu paciente está à sua espera</p>
                </div>
            </main>

            <div class="chat-app__input-container">
                <div class="chat-app__input-wrapper">
                    <input type="text" id="chat-input" class="chat-app__input" placeholder="Digite sua mensagem..."
                        autocomplete="off" />
                    <button id="send-button" class="chat-app__input-send" aria-label="Enviar mensagem">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" stroke="white" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Overlay para fechar sidebar no mobile -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>

    <template id="typing-indicator-template">
        <div class="typing-indicator">
            <div class="typing-indicator__dot"></div>
            <div class="typing-indicator__dot"></div>
            <div class="typing-indicator__dot"></div>
        </div>
    </template>

    <!-- Modal de Alteração de Senha -->
    <div class="modal-overlay hidden" id="change-password-modal">
        <div class="modal-card">
            <div class="modal-card__header">
                <h3 class="modal-card__title">Alterar Senha</h3>
                <button class="modal-card__close" id="close-password-modal" aria-label="Fechar modal">&times;</button>
            </div>
            <form id="change-password-form" class="modal-card__form">
                <div class="form-group">
                    <label for="old-password">Senha Atual</label>
                    <input type="password" id="old-password" class="form-input" required autocomplete="current-password"
                        placeholder="Digite sua senha atual">
                </div>
                <div class="form-group">
                    <label for="new-password">Nova Senha</label>
                    <input type="password" id="new-password" class="form-input" required autocomplete="new-password"
                        placeholder="Mínimo de 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirmar Nova Senha</label>
                    <input type="password" id="confirm-password" class="form-input" required autocomplete="new-password"
                        placeholder="Repita a nova senha">
                </div>
                <div class="modal-card__actions">
                    <button type="button" class="btn btn--secondary" id="cancel-password-modal">Cancelar</button>
                    <button type="submit" class="btn btn--primary" id="save-password-btn">Salvar Senha</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de Confirmação de Salvamento -->
    <div class="modal-overlay hidden" id="save-confirm-modal">
        <div class="modal-card">
            <div class="modal-card__header">
                <h3 class="modal-card__title">Salvar Consulta</h3>
                <button class="modal-card__close" id="close-save-confirm-modal"
                    aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-card__body" style="padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
                <p style="font-size: 0.9375rem; color: var(--color-gray-700); line-height: 1.5;">
                    Ao clicar em salvar, toda a conversa será salva, qualquer interação posterior ao salvamento será
                    permanentemente perdida.
                </p>
                <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
                    <input type="checkbox" id="dont-show-save-warning"
                        style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--color-primary);" />
                    <label for="dont-show-save-warning"
                        style="font-size: 0.8375rem; color: var(--color-gray-600); cursor: pointer; user-select: none;">
                        Não exibir esse aviso novamente
                    </label>
                </div>
            </div>
            <div class="modal-card__actions"
                style="padding: 1rem 1.5rem; border-top: 1px solid var(--color-gray-200); background: var(--color-gray-50); display: flex; justify-content: flex-end; gap: 0.75rem;">
                <button type="button" class="btn btn--secondary" id="cancel-save-confirm-modal">Cancelar</button>
                <button type="button" class="btn btn--primary" id="confirm-save-btn">Salvar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Renomear Consulta -->
    <div class="modal-overlay hidden" id="rename-chat-modal">
        <div class="modal-card">
            <div class="modal-card__header">
                <h3 class="modal-card__title">Renomear Consulta</h3>
                <button class="modal-card__close" id="close-rename-modal" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-card__form">
                <div class="form-group">
                    <label for="rename-input">Novo nome</label>
                    <input type="text" id="rename-input" class="form-input" maxlength="120" placeholder="Digite o novo nome para a consulta">
                </div>
                <div class="modal-card__actions">
                    <button type="button" class="btn btn--secondary" id="cancel-rename-modal">Cancelar</button>
                    <button type="button" class="btn btn--primary" id="confirm-rename-btn">Renomear</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast de feedback -->
    <div class="app-toast" id="app-toast"></div>

    <script type="module" src="/main.js"></script>
</body>

</html>
